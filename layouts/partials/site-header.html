<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0B6E69"/><circle cx="12" cy="16" r="6" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="20" cy="16" r="6" fill="none" stroke="#fff" stroke-width="2.2"/></svg>
      <span>KausalFlow Tools</span>
    </a>
    <nav class="nav" id="site-nav" aria-label="Main">
      <a href="/tools/"{{ if hasPrefix .RelPermalink "/tools/" }} aria-current="page"{{ end }}>Directory</a>
      <a href="/collections/"{{ if hasPrefix .RelPermalink "/collections/" }} aria-current="page"{{ end }}>Collections</a>
      <a href="/submit/"{{ if hasPrefix .RelPermalink "/submit/" }} aria-current="page"{{ end }}>Submit a tool</a>
      <a href="/about/"{{ if hasPrefix .RelPermalink "/about/" }} aria-current="page"{{ end }}>About</a>
      <a href="https://github.com/{{ .Site.Params.github }}" rel="noopener">GitHub</a>
    </nav>
    <div class="bar-actions">
      <div id="search-palette-mount"></div>
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
