{{ define "main" }}
<section class="page-head"><div class="wrap">
  <h1>{{ .Title }}</h1>
  {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
</div></section>
<div class="wrap" style="padding-top:32px;padding-bottom:64px">
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <div class="grid grid-3" style="margin-top:24px">
    {{ range .Pages }}
    <a class="tile" href="{{ .RelPermalink }}"><span class="tile-title">{{ .Title }}</span><span class="tile-sub">{{ .Params.summary | default .Params.description | plainify | truncate 140 }}</span></a>
    {{ end }}
  </div>
</div>
{{ end }}
