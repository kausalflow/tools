{{ define "main" }}
<section class="page-head"><div class="wrap">
  <h1>{{ .Title }}</h1>
</div></section>
<div class="wrap" style="padding-top:32px;padding-bottom:64px">
  {{ if eq .Data.Plural "collections" }}
  <div class="grid grid-2">
    {{ range .Pages }}
    <a class="coll" href="{{ .RelPermalink }}"><span class="mono-tile tint-{{ mod (len .Title) 6 }}" aria-hidden="true">{{ substr .Title 0 1 }}</span><span><span class="tile-title">{{ .Title }}</span><br><span class="tile-sub">{{ .Params.description | plainify | truncate 160 }}</span></span></a>
    {{ end }}
  </div>
  {{ else }}
  <div class="chip-row">
    {{ range .Data.Terms.Alphabetical }}<a class="chip" href="{{ .Page.RelPermalink }}">{{ .Page.Title }}&nbsp;<span style="color:var(--muted)">{{ .Count }}</span></a>{{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
