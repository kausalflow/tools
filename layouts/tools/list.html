{{ define "main" }}
<section class="page-head"><div class="wrap">
  <h1>Directory</h1>
  <p>Tools for every stage of research. Filter by field, platform or category.</p>
</div></section>
<div class="wrap dir">
  <aside class="facets" id="facets" aria-label="Filters"></aside>
  <div class="dir-main">
    <div class="dir-tools">
      <label class="sr-only" for="dir-q">Filter tools</label>
      <input id="dir-q" type="search" placeholder="Filter by name, tag or description" autocomplete="off">
      <button class="btn filters-toggle" type="button" id="filters-toggle" aria-expanded="false" aria-controls="facets">Filters</button>
      <label class="sr-only" for="dir-sort">Sort</label>
      <select id="dir-sort"><option value="new">Newest first</option><option value="name">Name A&ndash;Z</option></select>
    </div>
    <div style="display:flex;gap:16px;align-items:baseline">
      <span class="dir-count" id="dir-count" aria-live="polite">{{ len .Pages }} tools</span>
      <button class="btn" type="button" id="dir-clear" style="min-height:32px;padding:0 12px;font-size:14px">Clear filters</button>
    </div>
    <div class="grid grid-3" id="tool-grid">
      {{ range .Pages.ByDate.Reverse }}{{ partial "tool-card.html" . }}{{ end }}
    </div>
    <div class="empty" id="dir-empty" hidden>No tools match these filters. <a href="/submit/">Suggest one</a>.</div>
  </div>
</div>
{{ end }}
