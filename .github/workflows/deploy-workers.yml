name: Deploy workers

on:
  push:
    branches: [master]
    paths: ["workers/**"]
  pull_request:
    paths: ["workers/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [submit, mcp]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Needed when the token cannot list accounts ("Failed to automatically retrieve account IDs").
      # Repository variable or secret; the ID is on the Cloudflare dashboard's Workers overview.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: node workers/${{ matrix.worker }}/test.mjs
      - name: Skip deploy outside master or without a Cloudflare token
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "${{ github.event_name }}" = "pull_request" ]; then echo "Not deploying."; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        working-directory: workers/${{ matrix.worker }}
        run: npx --yes wrangler@4 deploy
