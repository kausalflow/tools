name: Deploy site

# Builds the Hugo site and publishes it with GitHub Pages.
# One-time: Settings > Pages > Source = GitHub Actions (or `gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow`).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.135.0"
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # baseURL comes from config.yaml so URLs stay https:// (Pages can report http://).
        run: hugo --gc --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
