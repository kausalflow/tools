name: Triage submissions

# Reads new form submissions from Netlify, checks them, and opens a pull request
# (ready / needs-info) or a tracking issue (reject) for each one.
# See docs/submission-flow.md for the one-time setup.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma separated submission ids to (re)process"
        required: false
        default: ""
      limit:
        description: "Maximum submissions per run"
        required: false
        default: "10"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/triage/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/triage/requirements.txt

      - name: Ensure labels exist
        run: |
          for l in "triage:5319e7" "ready:0e8a16" "needs-info:fbca04" "triage-reject:b60205"; do
            gh label create "${l%%:*}" --color "${l##*:}" --force >/dev/null
          done

      - name: Collect already processed submission ids
        run: |
          {
            gh pr list --state all --label triage --limit 1000 --json body --jq '.[].body'
            gh issue list --state all --label triage --limit 1000 --json body --jq '.[].body'
          } | grep -o 'netlify-submission:[0-9a-zA-Z]*' | cut -d: -f2 | sort -u > processed-ids.txt
          wc -l processed-ids.txt

      - name: Triage new submissions
        env:
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit || '10' }}
          TRIAGE_SINCE: ${{ vars.TRIAGE_SINCE }}
        run: |
          # only submissions after the go-live date; earlier ones were handled by hand
          args=(--netlify --out triage-out --skip-ids processed-ids.txt --limit "$LIMIT" --since "${TRIAGE_SINCE:-2026-10-15T13:30:00Z}")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); : > processed-ids.txt; fi
          python scripts/triage/triage.py "${args[@]}"

      - name: Open pull requests and issues
        run: bash scripts/triage/publish.sh triage-out
